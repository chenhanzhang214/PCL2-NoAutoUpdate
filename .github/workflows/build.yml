name: Build PCL2 No Auto Update
on:
  push:
    branches: [no-auto-update]
    tags: ['pcl2-*-no-autoupdate.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Record source commit
        shell: pwsh
        run: |
          $path = 'Plain Craft Launcher 2/Modules/Base/ModBase.vb'
          $text = [IO.File]::ReadAllText($path).Replace('Public Const CommitHash As String = ""', 'Public Const CommitHash As String = "${{ github.sha }}"')
          [IO.File]::WriteAllText($path, $text)
      - name: Restore dependencies
        run: dotnet restore PCLCS/PCLCS.csproj
      - name: Build Release
        run: msbuild "Plain Craft Launcher 2/Plain Craft Launcher 2.vbproj" -p:Configuration=Release -verbosity:minimal
      - name: Verify update commands cannot replace files
        shell: pwsh
        run: ./tests/Test-NoAutoUpdate.ps1 -Executable './Plain Craft Launcher 2/obj/Release/Plain Craft Launcher 2.exe'
      - name: Upload tested executable
        uses: actions/upload-artifact@v7
        with:
          name: PCL2-NoAutoUpdate-${{ github.sha }}
          path: Plain Craft Launcher 2/obj/Release/Plain Craft Launcher 2.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/pcl2-')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: PCL2-NoAutoUpdate-${{ github.sha }}
          path: tested
      - name: Package tested build and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path package, dist | Out-Null
          Copy-Item 'tested/Plain Craft Launcher 2.exe' 'package/PCL2-NoAutoUpdate.exe'
          Copy-Item LICENCE, NO_AUTO_UPDATE.md, RELEASE_NOTES.md package/
          Copy-Item 'package/PCL2-NoAutoUpdate.exe' dist/
          Compress-Archive -Path package/* -DestinationPath dist/PCL2-NoAutoUpdate.zip
          $sums = Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          Set-Content dist/SHA256SUMS.txt -Value $sums -Encoding ascii
          gh release create $env:GITHUB_REF_NAME dist/PCL2-NoAutoUpdate.exe dist/PCL2-NoAutoUpdate.zip dist/SHA256SUMS.txt --verify-tag --title 'PCL2 关闭自动更新版本 2.99.0-no-autoupdate.1（第三方修改）' --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
